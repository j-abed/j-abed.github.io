<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="summary-title summary-description"><title id="summary-title">What Everyone Missed About the 2026 Midterms</title><desc id="summary-description">The supplied November 4, 2026 snapshot shows a 14.3-point median Democratic House district swing. The same model implies 243 Democratic seats with pre-election inputs and 262 with the observed swing: a 19-seat difference, not official results. Its 95.7 percent classification accuracy across 392 called House races is retrospective and in-sample, not a pre-election forecast. External sources remain unverified.</desc><style>text{font-family:"Trebuchet MS",sans-serif;fill:#222825}.serif{font-family:Georgia,serif}.muted{fill:#66716b}.green{fill:#13766c}.blue{fill:#2168b5}.white{fill:white}</style><rect width="1200" height="1500" fill="#fff"/><rect x="76" y="41" width="38" height="5" fill="#13766c"/><text x="130" y="55" font-size="25" >DATA SCIENCE / 2026 MIDTERMS</text><text x="76" y="145" font-size="78" class="serif">What Everyone Missed</text><text x="76" y="237" font-size="78" class="serif">About the 2026</text><text x="76" y="329" font-size="78" class="serif">Midterms</text><text x="76" y="388" font-size="36" >The forecasts anticipated Democratic gains.</text><text x="76" y="434" font-size="36" >They underestimated how large those gains could be.</text><rect x="0" y="465" width="1200" height="280" fill="#edf4ef"/><text x="76" y="567" font-size="120" class="green">14.3</text><text x="76" y="638" font-size="43" class="serif">point median Democratic swing</text><text x="76" y="684" font-size="36" >The typical House district shifted toward Democrats</text><text x="76" y="729" font-size="36" >relative to its 2024 presidential margin.</text><line x1="599" y1="785" x2="599" y2="990" stroke="#cfd9d2" stroke-width="2"/><text x="76" y="785" font-size="34" >Pre-election swing estimate</text><text x="650" y="785" font-size="34" >Observed swing</text><text x="76" y="832" font-size="38" class="green">+11.3 points</text><text x="650" y="832" font-size="38" class="blue">+14.3 points</text><text x="76" y="927" font-size="88" class="green">243</text><text x="650" y="927" font-size="88" class="blue">262</text><text x="76" y="984" font-size="38" >Democratic seats</text><text x="650" y="984" font-size="38" >Democratic seats</text><text x="76" y="1030" font-size="36" >Model-implied seat counts, not official election results.</text><text x="76" y="1103" font-size="62" class="serif">19-seat difference</text><text x="76" y="1152" font-size="38" class="muted">Same model. Different information.</text><text x="76" y="1230" font-size="68" class="blue">95.7%</text><text x="350" y="1200" font-size="38" >of called House races</text><text x="350" y="1244" font-size="38" >correctly classified</text><text x="76" y="1293" font-size="36" >392 called races. Retrospective, in-sample result.</text><text x="76" y="1336" font-size="36" >Observed swing, not a pre-election forecast.</text><rect x="0" y="1357" width="1200" height="143" fill="#edf4ef"/><text x="76" y="1398" font-size="34" class="serif">The challenge wasn&apos;t just predicting who would win.</text><text x="76" y="1441" font-size="34" class="serif">It was estimating the size of the shift.</text><text x="76" y="1480" font-size="26" >Nov 4, 2026 / Unverified supplied snapshot / Jason Abed</text></svg>
