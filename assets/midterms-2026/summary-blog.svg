<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="summary-blog-title summary-blog-description"><title id="summary-blog-title">What Everyone Missed About the 2026 Midterms</title><desc id="summary-blog-description">The supplied November 4, 2026 snapshot shows a 14.3-point median Democratic House district swing. The same model implies 243 Democratic seats with pre-election inputs and 262 with the observed swing: a 19-seat difference, not official results. Its 95.7 percent classification accuracy across 392 called House races is retrospective and in-sample, not a pre-election forecast. External sources remain unverified.</desc><style>text{font-family:"Trebuchet MS",sans-serif;fill:#222825}.serif{font-family:Georgia,serif}.muted{fill:#66716b}.green{fill:#13766c}.blue{fill:#2168b5}.white{fill:white}</style><rect width="1200" height="700" fill="#fff"/><rect x="0" y="0" width="1200" height="258" fill="#f4f8f5"/><rect x="64" y="33" width="32" height="4" fill="#13766c"/><text x="112" y="45" font-size="21" >DATA SCIENCE / 2026 MIDTERMS</text><text x="64" y="120" font-size="66" class="serif">What the Forecasts Missed</text><text x="64" y="198" font-size="66" class="serif">About the 2026 Midterms</text><text x="64" y="242" font-size="28" class="muted">One model. Different information. A 19-seat gap.</text><text x="64" y="344" font-size="70" class="green">+14.3</text><text x="64" y="391" font-size="26" >Observed D swing</text><text x="64" y="428" font-size="23" class="muted">Median / 412 districts</text><text x="450" y="344" font-size="70" class="blue">95.7%</text><text x="450" y="391" font-size="26" >Retrospective accuracy</text><text x="450" y="428" font-size="23" class="muted">392 called House races</text><text x="836" y="344" font-size="70" class="green">+5.3</text><text x="836" y="391" font-size="26" >Polling miss toward D</text><text x="836" y="428" font-size="23" class="muted">34 Senate + governor races</text><line x1="64" y1="459" x2="1136" y2="459" stroke="#cfd9d2"/><text x="64" y="506" font-size="23" class="muted">PRE-ELECTION INPUTS</text><text x="650" y="506" font-size="23" class="muted">FITTED AFTER RESULTS</text><text x="64" y="553" font-size="34" class="green">+11.3 points / 243 D seats</text><text x="650" y="553" font-size="34" class="blue">+14.3 points / 262 D seats</text><text x="64" y="592" font-size="23" >Snapshot: 259 D seats called or leading. Not a final result.</text><text x="64" y="631" font-size="23" >Accuracy is a hindsight fit, not a forecast.</text><text x="64" y="673" font-size="21" class="muted">Preliminary Nov 4, 2026 / External sources unverified</text><text x="1136" y="673" font-size="23" text-anchor="end">Jason Abed</text></svg>
